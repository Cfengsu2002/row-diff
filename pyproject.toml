[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "row-diff"
version = "0.1.0"
description = "Disk-backed comparison and atomic change reports for keyed CSV snapshots"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
row-diff = "row_diff.cli:main"

[tool.setuptools]
packages = ["row_diff"]
